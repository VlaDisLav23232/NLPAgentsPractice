[project]
name = "flatmarket"
version = "0.1.0"
description = "Multi-agent flat market evaluation (DOM.RIA): Agent A collects listings, Agent B writes a report with charts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-mcp-adapters>=0.1",
    "langchain-google-genai>=2.0",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
flatmarket = "flatmarket.pipeline:main"
flatmarket-agent-a = "flatmarket.agent_a:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatmarket"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
